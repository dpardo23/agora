# Entrega continua de Ágora.
# - La web la despliega Vercel con su integración de Git: una preview por PR, staging desde develop y producción desde main.
# - Este workflow aplica las migraciones de Supabase y publica la release.
#   Producción requiere aprobación manual (environment «produccion» con revisor obligatorio).
name: CD

on:
  push:
    branches: [develop]
    tags: ['v*.*.*']

# Por defecto solo lectura; el job que publica la release pide escritura para sí mismo.
permissions:
  contents: read

jobs:
  detectar:
    name: Detectar componentes
    runs-on: ubuntu-latest
    outputs:
      hay_db: ${{ steps.existe.outputs.db }}
      supabase: ${{ steps.existe.outputs.supabase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: existe
        run: |
          echo "db=$([ -f supabase/config.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Misma versión de la CLI que el entorno local (mise.toml, ADR-006).
          python3 -c 'import tomllib; print("supabase=" + tomllib.load(open("mise.toml", "rb"))["tools"]["supabase"])' >> "$GITHUB_OUTPUT"

  migraciones-staging:
    name: Migraciones en staging
    needs: detectar
    if: github.ref == 'refs/heads/develop' && needs.detectar.outputs.hay_db == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ needs.detectar.outputs.supabase }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # --linked: la próxima versión mayor de la CLI apuntará a la base local por defecto.
      - run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  migraciones-produccion:
    name: Migraciones en producción
    needs: detectar
    if: startsWith(github.ref, 'refs/tags/v') && needs.detectar.outputs.hay_db == 'true'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ needs.detectar.outputs.supabase }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Crear la release con notas generadas desde los commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
