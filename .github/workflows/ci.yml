# Integración continua de Ágora.
# Corre en cada PR hacia develop o main y en cada push a esas ramas.
# El job «ci-ok» es el único check obligatorio en la protección de ramas: resume a todos los demás.
name: CI

on:
  pull_request:
    branches: [develop, main]
    # «edited» vuelve a validar el título cuando se corrige en el PR.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  PYTHON_VERSION: '3.12'

jobs:
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filtro.outputs.web }}
      db: ${{ steps.filtro.outputs.db }}
      worker: ${{ steps.filtro.outputs.worker }}
      hay_web: ${{ steps.existe.outputs.web }}
      hay_db: ${{ steps.existe.outputs.db }}
      hay_worker: ${{ steps.existe.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
      - id: filtro
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            db:
              - 'supabase/**'
            worker:
              - 'worker/**'
      - id: existe
        run: |
          echo "web=$([ -f apps/web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "db=$([ -f supabase/config.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "worker=$([ -f worker/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  convenciones:
    name: Convenciones (rama, PR y commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nombre de la rama
        env:
          RAMA: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            patron='^(release/sprint-[0-9]{2}|hotfix/v[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9-]+)$'
          else
            patron='^(feature/HU-[0-9]{2}\.[0-9]{2}-[a-z0-9-]+|tech/T-[0-9]{2}-[a-z0-9-]+|fix/BUG-[0-9]{3}-[a-z0-9-]+|(docs|ci|chore)/[a-z0-9-]+|hotfix/v[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9-]+|release/sprint-[0-9]{2})$'
          fi
          if ! echo "$RAMA" | grep -Eq "$patron"; then
            echo "::error::La rama «$RAMA» no cumple el modelo de ramas para «$BASE» (CONTRIBUTING.md, sección 1)."
            exit 1
          fi
      - name: Título del PR (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
      - name: Autoría de los commits (sin coautoría de IA)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          malos=$(git log --format='%H%n%an <%ae>%n%cn <%ce>%n%B' "$BASE_SHA..$HEAD_SHA" \
            | grep -Ei 'co-authored-by:|claude-session:|anthropic\.com|claude\.ai/code' || true)
          if [ -n "$malos" ]; then
            echo "::error::Hay commits con coautoría o autoría de herramientas de IA (CONTRIBUTING.md, sección 2, regla 6):"
            echo "$malos"
            exit 1
          fi
      - name: Mensajes de commit
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  seguridad:
    name: Seguridad (secretos y dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Revisión de dependencias nuevas
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Proyecto propietario: solo licencias permisivas (CONTRIBUTING.md, sección 6).
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, CC0-1.0, CC-BY-4.0, OFL-1.1, Python-2.0, MPL-2.0, BlueOak-1.0.0

  documentacion:
    name: Documentación (enlaces, autoría y formato)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/verificar-docs.py

  web:
    name: Web (lint, tipos, pruebas, build)
    needs: cambios
    if: needs.cambios.outputs.hay_web == 'true' && (needs.cambios.outputs.web == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --coverage
      - run: pnpm build
      - name: Contrato OpenAPI sin cambios sin documentar
        run: pnpm openapi:check

  e2e:
    name: E2E y accesibilidad (Playwright + axe)
    needs: [cambios, web]
    if: needs.cambios.outputs.hay_web == 'true' && (needs.cambios.outputs.web == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse (rendimiento, accesibilidad, PWA)
    needs: [cambios, web]
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.cambios.outputs.hay_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/web
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: apps/web/lighthouserc.json
          uploadArtifacts: true

  base-de-datos:
    name: Base de datos (migraciones, RLS, advisors)
    needs: cambios
    if: needs.cambios.outputs.hay_db == 'true' && (needs.cambios.outputs.db == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Aplicar migraciones desde cero
        run: supabase db reset
      - name: Pruebas pgTAP (RLS y funciones)
        run: supabase test db
      - name: Lint de esquema
        run: supabase db lint --level warning --fail-on error

  worker:
    name: Motor de agentes (ruff, mypy, pytest)
    needs: cambios
    if: needs.cambios.outputs.hay_worker == 'true' && (needs.cambios.outputs.worker == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy umss
      - run: uv run pytest --cov=umss

  ci-ok:
    name: ci-ok
    if: always()
    needs: [cambios, convenciones, seguridad, documentacion, web, e2e, lighthouse, base-de-datos, worker]
    runs-on: ubuntu-latest
    steps:
      - name: Resumen
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTADOS"
          if echo "$RESULTADOS" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo "::error::Al menos un job falló o se canceló."
            exit 1
          fi
