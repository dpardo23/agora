# Integración continua de Ágora.
# Corre en cada PR hacia develop o main y en cada push a esas ramas.
# El job «ci-ok» es el único check obligatorio en la protección de ramas: resume a todos los demás.
name: CI

on:
  pull_request:
    branches: [develop, main]
    # «edited» vuelve a validar el título cuando se corrige en el PR.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Las versiones de las herramientas se leen de mise.toml, la misma fuente que usa el entorno local
  # (ADR-006). Así el CI y el equipo del titular nunca divergen: para subir una versión basta con
  # editar mise.toml.
  versiones:
    name: Versiones (mise.toml)
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.leer.outputs.node }}
      pnpm: ${{ steps.leer.outputs.pnpm }}
      python: ${{ steps.leer.outputs.python }}
      uv: ${{ steps.leer.outputs.uv }}
      supabase: ${{ steps.leer.outputs.supabase }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: leer
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("mise.toml", "rb") as archivo:
              herramientas = tomllib.load(archivo)["tools"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as salida:
              for nombre in ("node", "pnpm", "python", "uv", "supabase"):
                  version = herramientas[nombre]
                  print(f"{nombre}: {version}")
                  salida.write(f"{nombre}={version}\n")
          PY

  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filtro.outputs.web }}
      db: ${{ steps.filtro.outputs.db }}
      worker: ${{ steps.filtro.outputs.worker }}
      hay_web: ${{ steps.existe.outputs.web }}
      hay_db: ${{ steps.existe.outputs.db }}
      hay_worker: ${{ steps.existe.outputs.worker }}
      hay_e2e: ${{ steps.existe.outputs.e2e }}
      hay_lighthouse: ${{ steps.existe.outputs.lighthouse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filtro
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            db:
              - 'supabase/**'
            worker:
              - 'worker/**'
      - id: existe
        run: |
          existe() { if [ -f "$1" ]; then echo true; else echo false; fi; }
          {
            echo "web=$(existe apps/web/package.json)"
            echo "db=$(existe supabase/config.toml)"
            echo "worker=$(existe worker/pyproject.toml)"
            # E2E necesita la configuración de Playwright y Supabase local (las pruebas usan la base).
            if [ "$(existe apps/web/playwright.config.ts)" = true ] && [ "$(existe supabase/config.toml)" = true ]; then
              echo "e2e=true"
            else
              echo "e2e=false"
            fi
            echo "lighthouse=$(existe apps/web/lighthouserc.json)"
          } >> "$GITHUB_OUTPUT"

  convenciones:
    name: Convenciones (rama, PR y commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Nombre de la rama
        env:
          RAMA: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$BASE" = "main" ]; then
            patron='^(release/sprint-[0-9]{2}|hotfix/v[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9-]+)$'
          elif [ "$AUTOR" = "dependabot[bot]" ]; then
            # Dependabot nombra sus ramas solo (dependabot/<ecosistema>/<rama>/<paquete>).
            patron='^dependabot/[A-Za-z0-9_./@-]+$'
          else
            patron='^(feature/HU-[0-9]{2}\.[0-9]{2}-[a-z0-9-]+|tech/T-[0-9]{2}-[a-z0-9-]+|fix/BUG-[0-9]{3}-[a-z0-9-]+|(docs|ci|chore)/[a-z0-9-]+|hotfix/v[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9-]+|release/sprint-[0-9]{2})$'
          fi
          if ! echo "$RAMA" | grep -Eq "$patron"; then
            echo "::error::La rama «$RAMA» no cumple el modelo de ramas para «$BASE» (.github/CONTRIBUTING.md, sección 1)."
            exit 1
          fi
      - name: Título del PR (Conventional Commits)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
      - name: Autoría de los commits (sin coautoría de IA)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          malos=$(git log --format='%H%n%an <%ae>%n%cn <%ce>%n%B' "$BASE_SHA..$HEAD_SHA" \
            | grep -Ei 'co-authored-by:|claude-session:|anthropic\.com|claude\.ai/code' || true)
          if [ -n "$malos" ]; then
            echo "::error::Hay commits con coautoría o autoría de herramientas de IA (.github/CONTRIBUTING.md, sección 2, regla 6):"
            echo "$malos"
            exit 1
          fi
      # Dependabot genera el cuerpo de sus commits (notas de versión con líneas largas) y no se
      # puede ajustar a commitlint; su título sí se valida en el paso anterior.
      - name: Mensajes de commit
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs

  seguridad:
    name: Seguridad (secretos y dependencias)
    needs: versiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rutas privadas (nada que coincida con .gitignore)
        run: |
          privados=$(git ls-files -ci --exclude-standard)
          if [ -n "$privados" ]; then
            echo "::error::Hay archivos versionados que .gitignore declara privados:"
            echo "$privados"
            exit 1
          fi
      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ needs.versiones.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.versiones.outputs.node }}
      # Vulnerabilidades conocidas en las dependencias de producción de todo el workspace.
      - name: Auditoría de dependencias (pnpm audit)
        run: pnpm audit --prod --audit-level high
      - name: Revisión de dependencias nuevas
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Proyecto propietario: solo licencias permisivas (.github/CONTRIBUTING.md, sección 6).
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, CC0-1.0, CC-BY-4.0, OFL-1.1, Python-2.0, MPL-2.0, BlueOak-1.0.0
          # Excepciones:
          # - libvips (LGPL-3.0), dependencia opcional de next a través de sharp, usada sin modificar
          #   (ADR-007).
          # - typing-extensions: su licencia declarada es PSF-2.0 (License-Expression en su METADATA),
          #   pero la detección de GitHub le suma por error GPL-1.0-or-later por el historial de Python
          #   que copia en LICENSE. No es copyleft.
          allow-dependencies-licenses: >-
            pkg:pypi/typing-extensions,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-darwin-arm64

  flujos:
    name: Workflows (actionlint y zizmor)
    needs: versiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sintaxis y expresiones (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ needs.versiones.outputs.uv }}
      - name: Seguridad de los workflows (zizmor)
        run: uvx zizmor@1.31.1 --offline --format github .github/workflows

  documentacion:
    name: Documentación (enlaces, autoría y formato)
    needs: versiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.versiones.outputs.python }}
      - run: python scripts/verificar-docs.py

  web:
    name: Web (lint, tipos, pruebas, build)
    needs: [versiones, cambios]
    if: needs.cambios.outputs.hay_web == 'true' && (needs.cambios.outputs.web == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ needs.versiones.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.versiones.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato (Prettier)
        run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Código y dependencias sin usar (Knip)
        run: pnpm knip
      - name: Pruebas unitarias con umbral de cobertura
        run: pnpm test:unit --coverage
      - run: pnpm build
      # El contrato OpenAPI llega con la primera ruta de /api/v1; hasta entonces el script no existe.
      - name: Contrato OpenAPI sin cambios sin documentar
        run: pnpm run --if-present openapi:check

  e2e:
    name: E2E y accesibilidad (Playwright + axe)
    needs: [versiones, cambios, web]
    # !cancelled(): corre también si «web» se saltó porque el cambio solo toca supabase/.
    if: "!cancelled() && needs.web.result != 'failure' && needs.cambios.outputs.hay_e2e == 'true' && (needs.cambios.outputs.web == 'true' || needs.cambios.outputs.db == 'true' || github.event_name == 'push')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ needs.versiones.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.versiones.outputs.node }}
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ needs.versiones.outputs.supabase }}
      - run: supabase start
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - name: E2E, accesibilidad y contrato (Playwright)
        run: pnpm test:e2e
      - name: Pruebas de API (Bruno)
        run: |
          pnpm start > "$RUNNER_TEMP/web.log" 2>&1 &
          timeout 60 sh -c 'until curl -fsS -o /dev/null http://localhost:3100/api/v1/salud; do sleep 1; done'
          pnpm test:api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  lighthouse:
    name: Lighthouse (rendimiento, accesibilidad, buenas prácticas)
    needs: [versiones, cambios, web]
    # En cada PR que toca la web, hacia develop o main (HU-16.04, RN-5).
    if: github.event_name == 'pull_request' && needs.web.result == 'success' && needs.cambios.outputs.hay_lighthouse == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ needs.versiones.outputs.pnpm }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.versiones.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # @lhci/cli del propio proyecto, con la configuración de apps/web/lighthouserc.json.
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse
          path: apps/web/.lighthouseci/reportes
          retention-days: 14

  base-de-datos:
    name: Base de datos (migraciones, RLS, advisors)
    needs: [versiones, cambios]
    if: needs.cambios.outputs.hay_db == 'true' && (needs.cambios.outputs.db == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ needs.versiones.outputs.supabase }}
      - run: supabase start
      - name: Aplicar migraciones desde cero
        run: supabase db reset
      - name: Pruebas pgTAP (RLS y funciones)
        run: supabase test db
      - name: Lint de esquema
        run: supabase db lint --level warning --fail-on error

  worker:
    name: Motor de agentes (ruff, mypy, pytest)
    needs: [versiones, cambios]
    if: needs.cambios.outputs.hay_worker == 'true' && (needs.cambios.outputs.worker == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ needs.versiones.outputs.uv }}
          python-version: ${{ needs.versiones.outputs.python }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy umss
      - run: uv run pytest --cov=umss

  # La imagen del worker se construye para las dos arquitecturas en runners nativos: amd64 (tu PC) y
  # arm64 (la Oracle VM). Solo corre cuando cambia worker/, porque instalar TeX Live tarda varios minutos.
  imagen-worker:
    name: Imagen del worker (${{ matrix.arquitectura }})
    needs: cambios
    if: needs.cambios.outputs.hay_worker == 'true' && needs.cambios.outputs.worker == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arquitectura: amd64
            runner: ubuntu-24.04
          - arquitectura: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir la imagen
        run: docker build -t agora/worker:prueba worker
      - name: Comprobar usuario, arquitectura, Chromium y compilación del .tex de prueba
        run: |
          docker run --rm -v "$PWD/worker/tests/fixtures:/tex:ro" agora/worker:prueba sh -c '
            set -e
            test "$(id -u)" = 10001
            uname -m
            chromium --version
            latexmk -xelatex -interaction=nonstopmode -output-directory=/tmp /tex/prueba.tex >/dev/null
            test -s /tmp/prueba.pdf
            .venv/bin/python -c "import umss"
          '

  ci-ok:
    name: ci-ok
    if: always()
    needs: [versiones, cambios, convenciones, seguridad, flujos, documentacion, web, e2e, lighthouse, base-de-datos, worker, imagen-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Resumen
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTADOS"
          if echo "$RESULTADOS" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo "::error::Al menos un job falló o se canceló."
            exit 1
          fi
