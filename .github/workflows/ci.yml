# Integración continua de Ágora.
# Corre en cada PR hacia develop o main y en cada push a esas ramas.
# El job «ci-ok» es el único check obligatorio en la protección de ramas: resume a todos los demás.
name: CI

on:
  pull_request:
    branches: [develop, main]
    # «edited» vuelve a validar el título cuando se corrige en el PR.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Las versiones de las herramientas se leen de mise.toml, la misma fuente que usa el entorno local
  # (ADR-006). Así el CI y el equipo del titular nunca divergen: para subir una versión basta con
  # editar mise.toml.
  versiones:
    name: Versiones (mise.toml)
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.leer.outputs.node }}
      pnpm: ${{ steps.leer.outputs.pnpm }}
      python: ${{ steps.leer.outputs.python }}
      uv: ${{ steps.leer.outputs.uv }}
      supabase: ${{ steps.leer.outputs.supabase }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: leer
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("mise.toml", "rb") as archivo:
              herramientas = tomllib.load(archivo)["tools"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as salida:
              for nombre in ("node", "pnpm", "python", "uv", "supabase"):
                  version = herramientas[nombre]
                  print(f"{nombre}: {version}")
                  salida.write(f"{nombre}={version}\n")
          PY

  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filtro.outputs.web }}
      db: ${{ steps.filtro.outputs.db }}
      worker: ${{ steps.filtro.outputs.worker }}
      hay_web: ${{ steps.existe.outputs.web }}
      hay_db: ${{ steps.existe.outputs.db }}
      hay_worker: ${{ steps.existe.outputs.worker }}
      hay_e2e: ${{ steps.existe.outputs.e2e }}
      hay_lighthouse: ${{ steps.existe.outputs.lighthouse }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: filtro
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            db:
              - 'supabase/**'
            worker:
              - 'worker/**'
      - id: existe
        run: |
          existe() { if [ -f "$1" ]; then echo true; else echo false; fi; }
          {
            echo "web=$(existe apps/web/package.json)"
            echo "db=$(existe supabase/config.toml)"
            echo "worker=$(existe worker/pyproject.toml)"
            # E2E necesita la configuración de Playwright y Supabase local (las pruebas usan la base).
            if [ "$(existe apps/web/playwright.config.ts)" = true ] && [ "$(existe supabase/config.toml)" = true ]; then
              echo "e2e=true"
            else
              echo "e2e=false"
            fi
            echo "lighthouse=$(existe apps/web/lighthouserc.json)"
          } >> "$GITHUB_OUTPUT"

  convenciones:
    name: Convenciones (rama, PR y commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Nombre de la rama
        env:
          RAMA: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$BASE" = "main" ]; then
            patron='^(release/sprint-[0-9]{2}|hotfix/v[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9-]+)$'
          elif [ "$AUTOR" = "dependabot[bot]" ]; then
            # Dependabot nombra sus ramas solo (dependabot/<ecosistema>/<rama>/<paquete>).
            patron='^dependabot/[A-Za-z0-9_./@-]+$'
          else
            patron='^(feature/HU-[0-9]{2}\.[0-9]{2}-[a-z0-9-]+|tech/T-[0-9]{2}-[a-z0-9-]+|fix/BUG-[0-9]{3}-[a-z0-9-]+|(docs|ci|chore)/[a-z0-9-]+|hotfix/v[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9-]+|release/sprint-[0-9]{2})$'
          fi
          if ! echo "$RAMA" | grep -Eq "$patron"; then
            echo "::error::La rama «$RAMA» no cumple el modelo de ramas para «$BASE» (CONTRIBUTING.md, sección 1)."
            exit 1
          fi
      - name: Título del PR (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true
      - name: Autoría de los commits (sin coautoría de IA)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          malos=$(git log --format='%H%n%an <%ae>%n%cn <%ce>%n%B' "$BASE_SHA..$HEAD_SHA" \
            | grep -Ei 'co-authored-by:|claude-session:|anthropic\.com|claude\.ai/code' || true)
          if [ -n "$malos" ]; then
            echo "::error::Hay commits con coautoría o autoría de herramientas de IA (CONTRIBUTING.md, sección 2, regla 6):"
            echo "$malos"
            exit 1
          fi
      # Dependabot genera el cuerpo de sus commits (notas de versión con líneas largas) y no se
      # puede ajustar a commitlint; su título sí se valida en el paso anterior.
      - name: Mensajes de commit
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: wagoid/commitlint-github-action@v6.2.1
        with:
          configFile: commitlint.config.mjs

  seguridad:
    name: Seguridad (secretos y dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Rutas privadas (nada que coincida con .gitignore)
        run: |
          privados=$(git ls-files -ci --exclude-standard)
          if [ -n "$privados" ]; then
            echo "::error::Hay archivos versionados que .gitignore declara privados:"
            echo "$privados"
            exit 1
          fi
      - name: Buscar secretos
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Revisión de dependencias nuevas
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          # Proyecto propietario: solo licencias permisivas (CONTRIBUTING.md, sección 6).
          allow-licenses: MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, CC0-1.0, CC-BY-4.0, OFL-1.1, Python-2.0, MPL-2.0, BlueOak-1.0.0
          # Única excepción aceptada: libvips (LGPL-3.0), dependencia opcional de next a través de sharp,
          # usada sin modificar (ADR-007).
          allow-dependencies-licenses: >-
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-darwin-arm64

  documentacion:
    name: Documentación (enlaces, autoría y formato)
    needs: versiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ needs.versiones.outputs.python }}
      - run: python scripts/verificar-docs.py

  web:
    name: Web (lint, tipos, pruebas, build)
    needs: [versiones, cambios]
    if: needs.cambios.outputs.hay_web == 'true' && (needs.cambios.outputs.web == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ needs.versiones.outputs.pnpm }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ needs.versiones.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --coverage
      - run: pnpm build
      # El contrato OpenAPI llega con la primera ruta de /api/v1; hasta entonces el script no existe.
      - name: Contrato OpenAPI sin cambios sin documentar
        run: pnpm run --if-present openapi:check

  e2e:
    name: E2E y accesibilidad (Playwright + axe)
    needs: [versiones, cambios, web]
    # !cancelled(): corre también si «web» se saltó porque el cambio solo toca supabase/.
    if: "!cancelled() && needs.web.result != 'failure' && needs.cambios.outputs.hay_e2e == 'true' && (needs.cambios.outputs.web == 'true' || needs.cambios.outputs.db == 'true' || github.event_name == 'push')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ needs.versiones.outputs.pnpm }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ needs.versiones.outputs.node }}
          cache: pnpm
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: ${{ needs.versiones.outputs.supabase }}
      - run: supabase start
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse (rendimiento, accesibilidad, PWA)
    needs: [versiones, cambios, web]
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.cambios.outputs.hay_lighthouse == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: ${{ needs.versiones.outputs.pnpm }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ needs.versiones.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/web
      - uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: apps/web/lighthouserc.json
          uploadArtifacts: true

  base-de-datos:
    name: Base de datos (migraciones, RLS, advisors)
    needs: [versiones, cambios]
    if: needs.cambios.outputs.hay_db == 'true' && (needs.cambios.outputs.db == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: ${{ needs.versiones.outputs.supabase }}
      - run: supabase start
      - name: Aplicar migraciones desde cero
        run: supabase db reset
      - name: Pruebas pgTAP (RLS y funciones)
        run: supabase test db
      - name: Lint de esquema
        run: supabase db lint --level warning --fail-on error

  worker:
    name: Motor de agentes (ruff, mypy, pytest)
    needs: [versiones, cambios]
    if: needs.cambios.outputs.hay_worker == 'true' && (needs.cambios.outputs.worker == 'true' || github.event_name == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ needs.versiones.outputs.uv }}
          python-version: ${{ needs.versiones.outputs.python }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy umss
      - run: uv run pytest --cov=umss

  ci-ok:
    name: ci-ok
    if: always()
    needs: [versiones, cambios, convenciones, seguridad, documentacion, web, e2e, lighthouse, base-de-datos, worker]
    runs-on: ubuntu-latest
    steps:
      - name: Resumen
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTADOS"
          if echo "$RESULTADOS" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo "::error::Al menos un job falló o se canceló."
            exit 1
          fi
