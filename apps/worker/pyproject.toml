[project]
name = "umss"
version = "0.1.0"
description = "Motor de agentes de Ágora: genera los documentos de estudio en PDF."
readme = "README.md"
authors = [{ name = "Juan Diego Pardo Pozo", email = "jdiegopardo23@gmail.com" }]
license = "LicenseRef-Propietaria"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
# Errores, estilo, imports, nombres, modernización, bugs probables, simplificaciones y docstrings.
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["umss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["umss"]
branch = true
