# Workspace de pnpm de Ágora (guía 3, sección 2). La configuración de pnpm vive aquí y no en .npmrc.
packages:
  # Solo la web: apps/worker es Python (uv) y no forma parte del workspace de pnpm.
  - apps/web

# pnpm 12 no ejecuta scripts de instalación salvo que se autoricen aquí. Los de esta lista se
# rechazan a propósito: estos paquetes traen binarios precompilados por plataforma como
# dependencias opcionales y su script solo comprueba o reconstruye algo que ya viene listo.
allowBuilds:
  '@swc/core': false
  esbuild: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - knip@6.44.1

# Versiones forzadas en todo el árbol de dependencias. Cada una lleva su motivo y se quita cuando el
# paquete que trae la versión vieja la actualice (pnpm why <paquete> -r).
overrides:
  # GHSA-mrhx-c7xc-m3w5 (alta): @serwist/turbopack y @serwist/build fijan zod 4.6.5. Parche 4.6.6 o
  # superior, en la misma línea que usa la aplicación.
  zod: 4.6.7
