# Workspace de pnpm de Ágora (guía 3, sección 2). La configuración de pnpm vive aquí y no en .npmrc.
packages:
  - apps/*

# pnpm 12 no ejecuta scripts de instalación salvo que se autoricen aquí. Los de esta lista se
# rechazan a propósito: estos paquetes traen binarios precompilados por plataforma como
# dependencias opcionales y su script solo comprueba o reconstruye algo que ya viene listo.
allowBuilds:
  '@swc/core': false
  esbuild: false
  sharp: false
  unrs-resolver: false
