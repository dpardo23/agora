<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calendario · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-claro{--bg:#FFFFFF;--bg2:#F3F3F0;--line:#E5E5E1;--tx:#0B0B0B;--tx2:#5A5A53;--ink:#0B0B0B;--on:#FFFFFF}
.t-oscuro{--bg:#000000;--bg2:#121212;--line:#242424;--tx:#F4F4EF;--tx2:#A3A39B;--ink:#F4F4EF;--on:#000000}
.app{--rosa:#F6C4B8;--mant:#F1DF97;--lila:#D2C5F3;--menta:#B9E3CA;--cielo:#B7D5F0;background:var(--bg);color:var(--tx);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45}
.d{font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:-0.025em;margin:0}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.mu{color:var(--tx2)}
.lbl{font-size:12px;font-weight:500;color:var(--tx2)}
a{color:inherit}
</style>
</helmet>
<div class="app t-{{tema}}" style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <div style="padding: 54px 18px 100px; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; align-items: center; gap: 8px">
      <h1 class="d" style="font-size: 30px; flex: 1; line-height: 1">Octubre</h1>
      <button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--tx); font: inherit">Mes</button>
      <button type="button" aria-label="Nuevo evento" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--ink); color: var(--on); font-size: 20px">+</button>
    </header>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{semana}}" as="d" hint-placeholder-count="7">
        <button type="button" style="{{d.st}}">
          <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.75">{{d.w}}</span>
          <span style="font-size: 17px; font-weight: 700">{{d.n}}</span>
          <span style="display: flex; gap: 2px; height: 5px"><sc-for list="{{d.dots}}" as="c" hint-placeholder-count="1"><span style="{{c}}"></span></sc-for></span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{dias}}" as="g" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; padding-bottom: 6px">
          <div style="display: flex; align-items: baseline; gap: 8px; padding: 12px 0 4px"><span style="font-weight: 700">{{g.t}}</span><span class="mu" style="font-size: 12px">{{g.s}}</span></div>
          <sc-for list="{{g.ev}}" as="e" hint-placeholder-count="2">
            <div style="display: grid; grid-template-columns: 52px 4px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 52px; border-top: 1px solid var(--line)">
              <span class="m mu" style="font-size: 11px">{{e.h}}</span><span style="{{e.bar}}"></span>
              <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 500">{{e.t}}</span><span class="mu" style="font-size: 12px">{{e.s}}</span></span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 10px 24px; background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="InicioMovil.dc.html" style="{{nv.inicio}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Inicio</a>
    <a href="TareasMovil.dc.html" style="{{nv.tareas}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4zM8.5 12l2.5 2.5 4.5-5"></path></svg>Tareas</a>
    <a href="BotMovil.dc.html" aria-label="Bot" style="justify-self: center; width: 54px; height: 54px; border-radius: 18px; background: var(--ink); color: var(--on); display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7h8a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-4a4 4 0 0 1 4-4zM12 3v4M9.5 12v1.5M14.5 12v1.5"></path></svg></a>
    <a href="CalendarioMovil.dc.html" style="{{nv.cal}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zM4 10h16M9 3v4M15 3v4"></path></svg>Agenda</a>
    <a href="RepasoMovil.dc.html" style="{{nv.repaso}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h7a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3zM8 4h10a3 3 0 0 1 3 3v10"></path></svg>Estudiar</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"oscuro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  mnav(a) {
    const s = (id) => 'display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; font-size: 10px; text-decoration: none; ' + (id === a ? 'color: var(--tx); font-weight: 600;' : 'color: var(--tx2);');
    return { inicio: s('inicio'), tareas: s('tareas'), cal: s('cal'), repaso: s('repaso') };
  }
  renderVals() {
    const C = { c: 'var(--lila)', e: 'var(--cielo)', p: 'var(--rosa)', b: 'var(--menta)' };
    const dot = (k) => 'width: 5px; height: 5px; border-radius: 50%; background: ' + C[k];
    const W = [['Dom', 11, ['b']], ['Lun', 12, ['c', 'c']], ['Mar', 13, ['c', 'e']], ['Mié', 14, ['c', 'e']], ['Jue', 15, ['p', 'c']], ['Vie', 16, ['c', 'e']], ['Sáb', 17, []]];
    const bar = (k) => 'width: 4px; height: 32px; border-radius: 4px; background: ' + C[k];
    const D = [
      ['Hoy', 'domingo 11', [['14:20', 'Fin estimado #14', 'Bot · Base de Datos II', 'b']]],
      ['Lunes', '12', [['07:45', 'Base de Datos II', 'Clase · [aula]', 'c'], ['09:45', 'Ecuaciones Diferenciales', 'Clase · [aula]', 'c']]],
      ['Martes', '13', [['23:59', 'Informe ISO/IEC 27001', 'Entrega · Seguridad', 'e']]],
      ['Jueves', '15', [['[hora]', 'Segundo parcial', 'Estadística II · [aula]', 'p']]]
    ];
    return {
      tema: (this.props.tema ?? 'oscuro') === 'claro' ? 'claro' : 'oscuro',
      nv: this.mnav('cal'),
      semana: W.map(([w, n, ks], i) => ({
        w, n, dots: ks.map(dot),
        st: 'display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; border-radius: 12px; font: inherit; cursor: pointer; border: 0; ' + (i === 0 ? 'background: var(--tx); color: var(--bg);' : 'background: var(--bg2); color: var(--tx);')
      })),
      dias: D.map(([t, s, ev]) => ({ t, s, ev: ev.map(([h, tt, ss, k]) => ({ h, t: tt, s: ss, bar: bar(k) })) }))
    };
  }
}
</script>
</body>
</html>
