<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Iniciar sesión · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-claro{--bg:#FFFFFF;--bg2:#F3F3F0;--line:#E5E5E1;--tx:#0B0B0B;--tx2:#5A5A53;--ink:#0B0B0B;--on:#FFFFFF;--warn:#B23C0C}
.t-oscuro{--bg:#000000;--bg2:#121212;--line:#242424;--tx:#F4F4EF;--tx2:#A3A39B;--ink:#F4F4EF;--on:#000000;--warn:#F4A27F}
.app{--rosa:#F6C4B8;--mant:#F1DF97;--lila:#D2C5F3;--menta:#B9E3CA;--cielo:#B7D5F0;background:var(--bg);color:var(--tx);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45}
.d{font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:-0.025em;margin:0}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.mu{color:var(--tx2)}
.in{min-height:52px;width:100%;box-sizing:border-box;padding:0 14px 0 44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;outline:none}
.in:focus{border-color:var(--tx)}
.lbl{font-size:12px;font-weight:500;color:var(--tx2)}
.code{width:46px;height:56px;box-sizing:border-box;text-align:center;font-family:'Geist Mono',ui-monospace,monospace;font-size:22px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);outline:none}
a{color:inherit}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</helmet>
<div class="app t-{{tema}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 26px; gap: 6px; padding: 58px 22px 0">
    <span style="grid-column: 1 / span 2; grid-row: 1 / span 2; border-radius: 10px; background: var(--cielo); animation: rise .6s ease both"></span>
    <span style="grid-column: 3 / span 4; grid-row: 1; border-radius: 10px; background: var(--mant); animation: rise .6s ease .08s both"></span>
    <span style="grid-column: 3; grid-row: 2; border-radius: 10px; background: var(--lila); animation: rise .6s ease .16s both"></span>
    <span style="grid-column: 4 / span 2; grid-row: 2; border-radius: 10px; background: var(--menta); animation: rise .6s ease .24s both"></span>
    <span style="grid-column: 6; grid-row: 2; border-radius: 10px; background: var(--rosa); animation: rise .6s ease .32s both"></span>
  </div>

  <div style="flex: 1; padding: 30px 22px 30px; display: flex; flex-direction: column; gap: 18px">
    <sc-if value="{{enLogin}}" hint-placeholder-val="{{true}}">
      <form onSubmit="{{entrar}}" style="{{formSt}}">
        <div style="display: flex; align-items: center; gap: 14px">
          <span style="width: 64px; height: 64px; flex: 0 0 64px; border-radius: 50%; background: var(--bg2); border: 1px solid var(--line); display: grid; place-items: center">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Usuario"><path d="M12 4a4 4 0 1 1 0 8a4 4 0 1 1 0-8zM4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
          </span>
          <div style="display: flex; flex-direction: column"><span class="d" style="font-size: 15px" aria-hidden="true">dpardo</span><h1 class="d" style="font-size: 28px; line-height: 1.05">Iniciar sesión</h1></div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="u" class="lbl">Usuario</label>
          <div style="position: relative">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 17px; color: var(--tx2)"><path d="M12 4a4 4 0 1 1 0 8a4 4 0 1 1 0-8zM4.5 20a7.5 7.5 0 0 1 15 0"></path></svg>
            <input id="u" class="in" type="text" autocomplete="username" autocapitalize="none" value="{{usr}}" onInput="{{onUsr}}" placeholder="dpardo">
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="p" class="lbl">Contraseña</label>
          <div style="position: relative">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 17px; color: var(--tx2)"><path d="M7 11h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2zM8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            <input id="p" class="in" type="{{tipo}}" autocomplete="current-password" value="{{pwd}}" onInput="{{onPwd}}" style="padding-right: 86px">
            <button type="button" onClick="{{ver}}" style="position: absolute; right: 8px; top: 9px; min-height: 34px; padding: 0 10px; border: 0; border-radius: 8px; background: var(--bg2); color: var(--tx); font: inherit; font-size: 12px">{{verTxt}}</button>
          </div>
        </div>
        <sc-if value="{{error}}" hint-placeholder-val="{{false}}"><span role="alert" style="font-size: 13px; font-weight: 500; color: var(--warn)">{{error}}</span></sc-if>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: var(--tx)">Recordar este dispositivo</label>
        <button type="submit" style="min-height: 56px; border-radius: 16px; border: 0; background: var(--ink); color: var(--on); font: inherit; font-weight: 600; font-size: 17px; cursor: pointer">Entrar</button>
        <a href="#" class="mu" style="text-align: center; font-size: 13px; min-height: 32px">¿Olvidaste la contraseña?</a>
      </form>
    </sc-if>

    <sc-if value="{{enCodigo}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 20px; animation: rise .4s ease both">
        <div style="display: flex; align-items: center; gap: 14px">
          <span style="width: 64px; height: 64px; flex: 0 0 64px; border-radius: 50%; background: var(--rosa); color: #0B0B0B; display: grid; place-items: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9 6 9-6M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg></span>
          <h1 class="d" style="font-size: 26px; line-height: 1.1">Revisa tu Gmail</h1>
        </div>
        <span class="mu">Código de 6 dígitos enviado a jdiego•••@gmail.com</span>
        <div role="group" aria-label="Código de verificación" style="display: flex; justify-content: space-between">
          <input class="code" inputmode="numeric" maxlength="1" aria-label="Dígito 1"><input class="code" inputmode="numeric" maxlength="1" aria-label="Dígito 2"><input class="code" inputmode="numeric" maxlength="1" aria-label="Dígito 3"><input class="code" inputmode="numeric" maxlength="1" aria-label="Dígito 4"><input class="code" inputmode="numeric" maxlength="1" aria-label="Dígito 5"><input class="code" inputmode="numeric" maxlength="1" aria-label="Dígito 6">
        </div>
        <a href="InicioMovil.dc.html" style="min-height: 56px; border-radius: 16px; background: var(--ink); color: var(--on); font-weight: 600; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center">Verificar y entrar</a>
        <div style="display: flex; justify-content: space-between; font-size: 13px"><button type="button" onClick="{{volver}}" style="background: none; border: 0; padding: 0; min-height: 36px; color: var(--tx2); font: inherit">‹ Volver</button><span class="m mu" style="align-self: center">Reenviar en 0:58</span></div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"oscuro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { usr: 'dpardo', pwd: '', verPwd: false, paso: 'login', error: '' };
  }
  renderVals() {
    const s = this.state;
    return {
      tema: (this.props.tema ?? 'oscuro') === 'claro' ? 'claro' : 'oscuro',
      usr: s.usr, pwd: s.pwd,
      onUsr: (e) => this.setState({ usr: e.target.value, error: '' }),
      onPwd: (e) => this.setState({ pwd: e.target.value, error: '' }),
      tipo: s.verPwd ? 'text' : 'password',
      verTxt: s.verPwd ? 'Ocultar' : 'Mostrar',
      ver: () => this.setState({ verPwd: !s.verPwd }),
      error: s.error,
      formSt: 'display: flex; flex-direction: column; gap: 16px; margin: 0; animation: ' + (s.error ? 'shake .4s ease' : 'rise .5s ease both') + ';',
      entrar: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!s.usr.trim() || !s.pwd) this.setState({ error: 'Ingresa tu usuario y tu contraseña.' });
        else this.setState({ paso: 'codigo', error: '' });
      },
      volver: () => this.setState({ paso: 'login' }),
      enLogin: s.paso === 'login', enCodigo: s.paso === 'codigo'
    };
  }
}
</script>
</body>
</html>
