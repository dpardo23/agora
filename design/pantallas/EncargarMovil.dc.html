<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Encargar · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-claro{--bg:#FFFFFF;--bg2:#F3F3F0;--line:#E5E5E1;--tx:#0B0B0B;--tx2:#5A5A53;--ink:#0B0B0B;--on:#FFFFFF}
.t-oscuro{--bg:#000000;--bg2:#121212;--line:#242424;--tx:#F4F4EF;--tx2:#A3A39B;--ink:#F4F4EF;--on:#000000}
.app{--rosa:#F6C4B8;--mant:#F1DF97;--lila:#D2C5F3;--menta:#B9E3CA;--cielo:#B7D5F0;background:var(--bg);color:var(--tx);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45}
.d{font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:-0.025em;margin:0}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.mu{color:var(--tx2)}
.in{min-height:48px;width:100%;box-sizing:border-box;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:15px;outline:none}
.in:focus{border-color:var(--tx)}
.lbl{font-size:12px;font-weight:500;color:var(--tx2)}
.f{display:flex;flex-direction:column;gap:6px}
a{color:inherit}
</style>
</helmet>
<div class="app t-{{tema}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 10px; padding: 54px 18px 12px">
    <a href="BotMovil.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 class="d" style="font-size: 22px; flex: 1">Nuevo encargo</h1>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 8px 18px 16px; display: flex; flex-direction: column; gap: 18px">
    <div class="f">
      <span class="lbl">Materia</span>
      <div style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -18px; padding: 0 18px">
        <sc-for list="{{materias}}" as="m" hint-placeholder-count="4">
          <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.sel}}" style="{{m.st}}"><span style="{{m.dot}}"></span>{{m.nombre}}</button>
        </sc-for>
        <a href="AgregarMateriaMovil.dc.html" class="mu" style="flex: 0 0 auto; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px dashed var(--line); display: inline-flex; align-items: center; text-decoration: none; font-size: 13px">+ Materia</a>
      </div>
    </div>
    <div class="f"><label for="tm" class="lbl">Tema</label><input id="tm" class="in" type="text" value="Pruebas de hipótesis para dos medias"></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div class="f">
        <span class="lbl">Páginas</span>
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); padding: 0 2px">
          <button type="button" onClick="{{menos}}" aria-label="Menos páginas" style="width: 44px; height: 44px; border: 0; background: none; color: var(--tx); font-size: 20px; cursor: pointer">−</button>
          <span class="d" style="font-size: 20px">{{pags}}</span>
          <button type="button" onClick="{{mas}}" aria-label="Más páginas" style="width: 44px; height: 44px; border: 0; background: none; color: var(--tx); font-size: 20px; cursor: pointer">+</button>
        </div>
      </div>
      <div class="f">
        <span class="lbl">Fuentes</span>
        <button type="button" style="min-height: 48px; border-radius: 12px; border: 1px dashed var(--line); background: none; color: var(--tx); font: inherit; cursor: pointer">Adjuntar</button>
      </div>
    </div>
    <div class="f"><label for="ix" class="lbl">Indicaciones</label><textarea id="ix" class="in" rows="3" style="padding: 12px 14px; resize: none" placeholder="Enfoque, ejercicios resueltos, nivel de detalle"></textarea></div>
    <button type="button" onClick="{{toggleAprob}}" aria-pressed="{{aprob}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0; background: none; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--tx); font: inherit; text-align: left; cursor: pointer">
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 500">Aprobar esquema antes</span><span class="mu" style="font-size: 12px">Te aviso cuando esté listo</span></span>
      <span style="{{swT}}"><span style="width: 20px; height: 20px; border-radius: 50%; background: var(--bg)"></span></span>
    </button>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span class="lbl">Se entrega en Google Drive</span>
      <span class="m" style="font-size: 12px">Mi unidad / UMSS / {{matSel}} / Bot</span>
    </div>
  </div>

  <div style="padding: 12px 18px 30px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="min-height: 54px; border-radius: 14px; border: 0; background: var(--ink); color: var(--on); font: inherit; font-weight: 600; font-size: 16px; cursor: pointer">Encargar al bot</button>
    <span class="mu" style="font-size: 12px; text-align: center">Claude redacta · Gemini prepara fichas y bibliografía</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"oscuro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { materia: 'est2', pags: 10, aprob: true };
  }
  renderVals() {
    const mats = [['est2', 'Estadística II', 'mant'], ['bd2', 'Base de Datos II', 'cielo'], ['ed', 'Ecuaciones Diferenciales', 'lila'], ['seg', 'Seguridad de Sistemas', 'menta']];
    const on = this.state.aprob;
    return {
      tema: (this.props.tema ?? 'oscuro') === 'claro' ? 'claro' : 'oscuro',
      materias: mats.map(([id, nombre, c]) => {
        const s = this.state.materia === id;
        return {
          nombre, sel: s ? 'true' : 'false', pick: () => this.setState({ materia: id }),
          dot: 'width: 8px; height: 8px; border-radius: 50%; background: var(--' + c + ')',
          st: 'flex: 0 0 auto; min-height: 44px; padding: 0 14px; border-radius: 10px; font: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; ' + (s ? 'border: 1px solid var(--tx); background: var(--bg2); color: var(--tx); font-weight: 600;' : 'border: 1px solid var(--line); background: transparent; color: var(--tx2);')
        };
      }),
      matSel: mats.find((m) => m[0] === this.state.materia)[1],
      pags: this.state.pags,
      menos: () => this.setState({ pags: Math.max(2, this.state.pags - 1) }),
      mas: () => this.setState({ pags: Math.min(40, this.state.pags + 1) }),
      aprob: on ? 'true' : 'false',
      toggleAprob: () => this.setState({ aprob: !on }),
      swT: 'width: 46px; height: 26px; flex: 0 0 46px; border-radius: 99px; padding: 3px; box-sizing: border-box; display: flex; transition: all .2s; ' + (on ? 'background: var(--tx); justify-content: flex-end;' : 'background: var(--line); justify-content: flex-start;')
    };
  }
}
</script>
</body>
</html>
