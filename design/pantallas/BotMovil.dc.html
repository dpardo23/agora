<style>
body{margin:0}
.t-claro{--bg:#FFFFFF;--bg2:#F3F3F0;--line:#E5E5E1;--tx:#0B0B0B;--tx2:#5A5A53;--ink:#0B0B0B;--on:#FFFFFF;--warn:#B23C0C}
.t-oscuro{--bg:#000000;--bg2:#121212;--line:#242424;--tx:#F4F4EF;--tx2:#A3A39B;--ink:#F4F4EF;--on:#000000;--warn:#F4A27F}
.app{--rosa:#F6C4B8;--mant:#F1DF97;--lila:#D2C5F3;--menta:#B9E3CA;--cielo:#B7D5F0;background:var(--bg);color:var(--tx);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45}
.d{font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:-0.025em;margin:0}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.px{font-family:'Pixelify Sans','Geist Mono',ui-monospace,monospace}
.mu{color:var(--tx2)}
.lbl{font-size:12px;font-weight:500;color:var(--tx2)}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--on);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-sizing:border-box}
.btn2{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-sizing:border-box}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500;color:#0B0B0B;white-space:nowrap}
.in{min-height:42px;width:100%;box-sizing:border-box;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;outline:none}
.in:focus{border-color:var(--tx)}
.scene{position:absolute;left:0;top:0;width:960px;height:720px;transform:scale(.3729);transform-origin:0 0;box-sizing:border-box;border:10px solid #23212B;background-color:#3D3F48;background-image:linear-gradient(45deg,#454751 25%,transparent 25%,transparent 75%,#454751 75%),linear-gradient(45deg,#454751 25%,transparent 25%,transparent 75%,#454751 75%);background-size:48px 48px;background-position:0 0,24px 24px;overflow:hidden}
.room{position:absolute;box-sizing:border-box;border:6px solid #23212B}
.face{position:absolute;left:0;top:0;right:0;height:30px;border-bottom:4px solid #23212B}
.o{position:absolute;box-sizing:border-box}
.door{position:absolute;background:#3D3F48}
.pp{position:absolute;width:36px;height:54px;padding:0;border:0;background:none;cursor:pointer;transition:left 1.5s linear,top 1.5s linear}
.fig{position:absolute;inset:0}
.sit .fig{animation:type .5s steps(1) infinite}
.idle .fig{animation:breathe 1.6s steps(1) infinite}
.fa{animation:fA .36s steps(1) infinite}
.fb{animation:fB .36s steps(1) infinite}
.bub{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);white-space:nowrap;font-size:12px;line-height:1.15;padding:4px 7px;background:#FFFFFF;color:#1B1A1F;border:2px solid #1B1A1F;box-shadow:3px 3px 0 #1B1A1F;z-index:2}
.bub::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-4px;width:6px;height:6px;background:#FFFFFF;border-right:2px solid #1B1A1F;border-bottom:2px solid #1B1A1F;transform:rotate(45deg)}
.lowb{bottom:auto;top:72px}
.lowb::after{bottom:auto;top:-6px;transform:rotate(225deg)}
.plate{position:absolute;left:50%;top:55px;transform:translateX(-50%);white-space:nowrap;font-size:10px;padding:0 4px;background:rgba(27,26,31,.82);color:#EEEBE3}
.arrow{position:absolute;left:12px;top:-14px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #F2D14B;filter:drop-shadow(0 2px 0 #1B1A1F);animation:hop .6s steps(2) infinite}
.sign{position:absolute;padding:1px 6px;font-size:11px;letter-spacing:.06em;background:#1B1A1F;color:#EEEBE3;border:2px solid #EEEBE3;z-index:900}
.scene .bub,.scene .plate,.scene .sign{display:none}
.arrow{border-left-width:14px;border-right-width:14px;border-top-width:18px;left:4px;top:-22px}
a{color:inherit}
@keyframes type{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes breathe{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes fA{0%{opacity:1}50%{opacity:0}}
@keyframes fB{0%{opacity:0}50%{opacity:1}}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes steam{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-10px);opacity:0}}
</style>

    const STEPS = [['Descargar fuentes', 'inv', 'Python', 'h'], ['Fichas de pasajes', 'fic', 'Gemini', 'h'], ['Esquema', 'ctl', 'Claude', 'h'], ['Redacción 3 de 6', 'red', 'Claude', 'a'], ['Citas literales', 'ver', 'Python', 'e'], ['Bibliografía por DOI', 'inv', 'Gemini', 'e'], ['Compilar LaTeX', 'maq', 'TeX Live', 'e'], ['Barrera de entrega', 'ver', 'Python', 'e'], ['Entrega en Drive', 'arc', 'Drive API', 'e']];
    const segs = [];
    STEPS.forEach((st, i) => { const a0 = i * 40, b0 = a0 + 38; const col = st[3] === 'h' ? 'var(--tx)' : st[3] === 'a' ? '#3FA36B' : 'var(--line)'; segs.push(col + ' ' + a0 + 'deg ' + b0 + 'deg', 'transparent ' + b0 + 'deg ' + (a0 + 40) + 'deg'); });
    const lab = { h: 'hecho', a: 'en curso', e: 'espera' };
    const top = { h: 'var(--tx)', a: '#3FA36B', e: 'var(--line)' };
    const mot = (m) => m.indexOf('Claude') === 0 ? 'background: var(--rosa)' : m.indexOf('Gemini') === 0 ? 'background: var(--cielo)' : 'background: var(--bg2); color: var(--tx)';
    const sel = byId[s.sel] || A[0];
    const se = P[sel.id] ? 'i' : sel.st;
    const mats = [['est2', 'Estadística II', 'mant', '2008054'], ['bd2', 'Base de Datos II', 'cielo', '2010016'], ['ed', 'Ecuaciones Diferenciales', 'lila', '[código]'], ['seg', 'Seguridad de Sistemas', 'menta', '[código]']];
    const matC = { 'Estadística II': 'background: var(--mant)', 'Base de Datos II': 'background: var(--cielo)', 'Ecuaciones Diferenciales': 'background: var(--lila)', 'Seguridad de Sistemas': 'background: var(--menta)' };
    const ms = mats.find((m) => m[0] === s.materia);
    const on = s.aprob;
    const DOCS = [
      { id: '#16', tema: 'Controles del Anexo A de ISO/IEC 27001', materia: 'Seguridad de Sistemas', estado: 'Espera tu aprobación', pags: 14, costo: '', drive: 'UMSS/Seguridad de Sistemas/Bot', aprobar: true, k: 'cola' },
      { id: '#15', tema: 'Pruebas de hipótesis para dos medias', materia: 'Estadística II', estado: 'Investigador · fuentes 4/6', pags: 10, costo: '', drive: 'UMSS/Estadística II/Bot', k: 'cola' },
      { id: '#13', tema: 'Transacciones y control de concurrencia', materia: 'Base de Datos II', estado: 'Entregado', pags: 14, costo: '9,40', drive: 'UMSS/Base de Datos II/Bot', pdf: true, k: 'ent' },
      { id: '#12', tema: 'EDO lineales de segundo orden', materia: 'Ecuaciones Diferenciales', estado: 'Entregado · 1 error resuelto', pags: 11, costo: '6,10', drive: 'UMSS/Ecuaciones Diferenciales/Bot', pdf: true, error: true, k: 'err' },
      { id: '#11', tema: 'Distribuciones muestrales', materia: 'Estadística II', estado: 'Entregado', pags: 9, costo: '4,80', drive: 'UMSS/Estadística II/Bot', pdf: true, k: 'ent' }
    ];
    const TABS = [['todos', 'Todos'], ['cola', 'En cola 2'], ['ent', 'Entregados 18'], ['err', 'Errores 1']];
    return {
      tema: (this.props.tema ?? 'oscuro') === 'claro' ? 'claro' : 'oscuro',
      nav: this.nav('bot'),
      cW: gente.filter((g) => g.here).length, cB: A.filter((a) => a.st === 'b').length,
      props, desks, gente,
      paper: this.spr(['kkkk.', 'kWWkk', 'kWWWk', 'kWbWk', 'kWWWk', 'kWbWk', 'kkkkk'], B, 3),
      ring: 'conic-gradient(' + segs.join(', ') + ')',
      pct: Math.round(3.55 / 9 * 100),
      pasos: STEPS.map(([nombre, ag, motor, st], i) => ({
        nombre, motor, num: String(i + 1).padStart(2, '0'), estado: lab[st], agente: byId[ag].corto, motorSt: mot(motor),
        face: person(ag, byId[ag].col, false, LST).replace('width: 3px; height: 3px;', 'width: 1px; height: 1px;').replace(/(-?\d+)px (-?\d+)px 0 0/g, (m0, a1, b1) => (a1 / 3) + 'px ' + (b1 / 3) + 'px 0 0'),
        pick: () => this.setState({ sel: ag }),
        st: 'width: 100%; height: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding: 10px 0 0; background: none; border: 0; border-top: 3px solid ' + top[st] + '; color: var(--tx); font: inherit; text-align: left; cursor: pointer; ' + (st === 'e' ? 'opacity: 0.62;' : '') + (ag === s.sel ? ' outline: 2px dashed var(--tx); outline-offset: 4px;' : '')
      })),
      log: [
        { t: '13:58:02', ag: 'Redactor', txt: 'sección 3.1 «Dependencias funcionales» redactada' },
        { t: '13:58:40', ag: 'Verificador', txt: '5 de 5 citas literales confirmadas' },
        { t: '14:00:20', ag: 'Maquetador', txt: 'sin trabajo: pasa a la sala de descanso' },
        { t: '14:01:15', ag: 'Redactor', txt: 'lleva la sección 3.2 al Verificador' },
        { t: '14:02:11', ag: 'Ilustrador', txt: 'entrega la figura 1 al Maquetador' }
      ],
      docTabs: TABS.map(([k, t]) => ({ t, on: s.docTab === k ? 'true' : 'false', pick: () => this.setState({ docTab: k }), st: 'background: none; border: 0; padding: 0 0 10px; font: inherit; cursor: pointer; ' + (s.docTab === k ? 'border-bottom: 2px solid var(--tx); color: var(--tx); font-weight: 600;' : 'border-bottom: 2px solid transparent; color: var(--tx2);') })),
      docs: DOCS.filter((d) => s.docTab === 'todos' || d.k === s.docTab || (s.docTab === 'ent' && d.k === 'err')).map((d) => ({ ...d, aprobar: !!d.aprobar, pdf: !!d.pdf, error: !!d.error, matSt: matC[d.materia] })),
      chips: A.map((a) => { const on = a.id === s.sel; return { n: a.corto, on: on ? 'true' : 'false', est: txt[P[a.id] ? 'i' : a.st], dot: 'width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; background: ' + dotC[P[a.id] ? 'i' : a.st], pick: () => this.setState({ sel: a.id }), st: 'flex: 0 0 auto; min-height: 38px; padding: 0 10px; border-radius: 8px; font: inherit; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; ' + (on ? 'border: 2px solid var(--tx); background: var(--bg2); color: var(--tx);' : 'border: 1px solid var(--line); background: transparent; color: var(--tx2);') }; }),
      barra: STEPS.map((x) => 'flex: 1; height: 6px; border-radius: 3px; background: ' + top[x[3]]),
      selMsg: (gente.find((g) => g.isSel) || {}).msg || '',
      esCtl: sel.id === 'ctl',
      irEncargo: () => this.setState({ sel: 'ctl' }),
      sel: {
        n: sel.n, sala: sel.sala, rol: sel.rol, motor: sel.motor, motorSt: mot(sel.motor), hoy: sel.hoy,
        estado: txt[se], dot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + dotC[se],
        face: person(sel.id, sel.col, false, LST).replace('width: 3px; height: 3px;', 'width: 4px; height: 4px;').replace(/(-?\d+)px (-?\d+)px 0 0/g, (m0, a1, b1) => (a1 / 3 * 4) + 'px ' + (b1 / 3 * 4) + 'px 0 0'),
        tarea: P[sel.id] ? 'En pausa · ' + sel.tarea : sel.tarea,
        prog: 'height: 100%; border-radius: 6px; background: var(--tx); transition: width .4s; width: ' + sel.p + '%',
        pasos: STEPS.filter((x) => x[1] === sel.id).map((x) => ({ n: x[0], e: lab[x[3]], dot: 'width: 8px; height: 8px; border-radius: 2px; background: ' + top[x[3]] })),
        sinPasos: STEPS.filter((x) => x[1] === sel.id).length === 0,
        cola: sel.cola, sinCola: sel.cola.length === 0, log: sel.log
      },
      pausaTxt: P[sel.id] ? 'Reanudar agente' : 'Pausar agente',
      pausar: () => this.setState({ pausa: { ...P, [sel.id]: !P[sel.id] } }),
      matOpen: s.matOpen, matOpenA: s.matOpen ? 'true' : 'false',
      toggleMat: () => this.setState({ matOpen: !s.matOpen }),
      materias: mats.map(([id, nombre, c, cod]) => {
        const sl = s.materia === id;
        return { nombre, cod, sel: sl ? 'true' : 'false', pick: () => this.setState({ materia: id, matOpen: false }), dot: 'width: 8px; height: 8px; border-radius: 50%; background: var(--' + c + ')', st: 'width: 100%; min-height: 38px; padding: 0 10px; border: 0; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; text-align: left; color: var(--tx); ' + (sl ? 'background: var(--bg2); font-weight: 600;' : 'background: transparent;') };
      }),
      matSel: ms[1], matSelDot: 'width: 10px; height: 10px; border-radius: 50%; background: var(--' + ms[2] + ')',
      aprob: on ? 'true' : 'false',
      toggleAprob: () => this.setState({ aprob: !on }),
      swT: 'width: 40px; height: 24px; flex: 0 0 40px; border-radius: 99px; padding: 3px; box-sizing: border-box; display: flex; transition: all .2s; ' + (on ? 'background: var(--tx); justify-content: flex-end;' : 'background: var(--line); justify-content: flex-start;')
    };
  }
}
</script>
