<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tareas · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-claro{--bg:#FFFFFF;--bg2:#F3F3F0;--line:#E5E5E1;--tx:#0B0B0B;--tx2:#5A5A53;--ink:#0B0B0B;--on:#FFFFFF;--warn:#B23C0C}
.t-oscuro{--bg:#000000;--bg2:#121212;--line:#242424;--tx:#F4F4EF;--tx2:#A3A39B;--ink:#F4F4EF;--on:#000000;--warn:#F4A27F}
.app{--rosa:#F6C4B8;--mant:#F1DF97;--lila:#D2C5F3;--menta:#B9E3CA;--cielo:#B7D5F0;background:var(--bg);color:var(--tx);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45}
.d{font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;font-weight:700;letter-spacing:-0.025em;margin:0}
.m{font-family:'Geist Mono',ui-monospace,monospace}
.mu{color:var(--tx2)}
.lbl{font-size:12px;font-weight:500;color:var(--tx2)}
.chip{flex:0 0 auto;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--tx2);font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px}
a{color:inherit}
</style>
</helmet>
<div class="app t-{{tema}}" style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <div style="padding: 54px 0 100px; display: flex; flex-direction: column; gap: 14px">
    <header style="display: flex; align-items: baseline; gap: 10px; padding: 0 18px">
      <h1 class="d" style="font-size: 30px; flex: 1">Tareas</h1>
      <span class="mu" style="font-size: 12px">Google Tasks · al día</span>
    </header>
    <div style="display: flex; gap: 6px; overflow-x: auto; padding: 0 18px">
      <button type="button" class="chip" aria-pressed="true" style="background: var(--tx); color: var(--bg); border-color: var(--tx); font-weight: 600">Todas 12</button>
      <button type="button" class="chip" aria-pressed="false">Hoy 3</button>
      <button type="button" class="chip" aria-pressed="false"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--mant)"></span>Estadística II</button>
      <button type="button" class="chip" aria-pressed="false"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--cielo)"></span>BD II</button>
    </div>

    <div style="padding: 0 18px; display: flex; flex-direction: column">
      <sc-for list="{{grupos}}" as="g" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column">
          <div style="display: flex; align-items: baseline; gap: 8px; padding: 12px 0 4px"><h2 style="{{g.hs}}">{{g.t}}</h2><span class="m mu" style="font-size: 12px">{{g.n}}</span></div>
          <sc-for list="{{g.items}}" as="t" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 58px; border-top: 1px solid var(--line)">
              <button type="button" aria-label="Completar" style="width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%; border: 1.5px solid var(--tx2); background: transparent; padding: 0"></button>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.t}}</span>
                <span class="mu" style="font-size: 12px; display: flex; align-items: center; gap: 6px"><span style="{{t.dot}}"></span>{{t.m}}<sc-if value="{{t.s}}" hint-placeholder-val="{{false}}"> · {{t.s}}</sc-if></span>
              </span>
              <span style="{{t.fs}}">{{t.f}}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>

  <button type="button" aria-label="Nueva tarea" style="position: absolute; right: 18px; bottom: 100px; width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--ink); color: var(--on); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.35)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 10px 24px; background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="InicioMovil.dc.html" style="{{nv.inicio}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Inicio</a>
    <a href="TareasMovil.dc.html" style="{{nv.tareas}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4zM8.5 12l2.5 2.5 4.5-5"></path></svg>Tareas</a>
    <a href="BotMovil.dc.html" aria-label="Bot" style="justify-self: center; width: 54px; height: 54px; border-radius: 18px; background: var(--ink); color: var(--on); display: grid; place-items: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7h8a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-4a4 4 0 0 1 4-4zM12 3v4M9.5 12v1.5M14.5 12v1.5"></path></svg></a>
    <a href="CalendarioMovil.dc.html" style="{{nv.cal}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h10a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zM4 10h16M9 3v4M15 3v4"></path></svg>Agenda</a>
    <a href="RepasoMovil.dc.html" style="{{nv.repaso}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h7a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3zM8 4h10a3 3 0 0 1 3 3v10"></path></svg>Estudiar</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","oscuro"],"default":"oscuro"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  mnav(a) {
    const s = (id) => 'display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; font-size: 10px; text-decoration: none; ' + (id === a ? 'color: var(--tx); font-weight: 600;' : 'color: var(--tx2);');
    return { inicio: s('inicio'), tareas: s('tareas'), cal: s('cal'), repaso: s('repaso') };
  }
  renderVals() {
    const C = { 'Estadística II': 'mant', 'Base de Datos II': 'cielo', 'Ecuaciones Dif.': 'lila', 'Seguridad': 'menta' };
    const G = [
      ['v', 'Vencidas', [['Resumen de índices B+', 'Base de Datos II', '', 'Ayer']]],
      ['h', 'Hoy', [['Práctica 3: varianza', 'Estadística II', '2/5', 'Hoy'], ['Leer cap. 7: recuperación', 'Base de Datos II', '', 'Hoy'], ['Repasar 24 tarjetas', 'Estadística II', '', 'Hoy']]],
      ['s', 'Esta semana', [['Informe ISO/IEC 27001', 'Seguridad', '1/4', 'Mar 13'], ['Práctica de Laplace', 'Ecuaciones Dif.', '', 'Mié 14'], ['Estudiar segundo parcial', 'Estadística II', '', 'Jue 15']]]
    ];
    return {
      tema: (this.props.tema ?? 'oscuro') === 'claro' ? 'claro' : 'oscuro',
      nv: this.mnav('tareas'),
      grupos: G.map(([k, t, its]) => ({
        t, n: its.length,
        hs: 'margin: 0; font-size: 13px; font-weight: 600; ' + (k === 'v' ? 'color: var(--warn);' : ''),
        items: its.map(([tt, m, s, f]) => ({ t: tt, m, s, f, dot: 'width: 7px; height: 7px; border-radius: 50%; background: var(--' + C[m] + ')', fs: 'font-size: 12px; ' + (k === 'v' ? 'color: var(--warn); font-weight: 600;' : k === 'h' ? 'font-weight: 600;' : 'color: var(--tx2);') }))
      }))
    };
  }
}
</script>
</body>
</html>
